# Fly.io config for karma-ai.
# GEMINI_API_KEY is a secret and never belongs here — set it once with:
#   fly secrets set GEMINI_API_KEY=... -a karma-ai
app = "karma-ai"
primary_region = "ams"

[env]
  # src/server.js reads process.env.PORT, so this MUST match internal_port below.
  # Without it Node falls back to 3000 and the Fly proxy cannot reach the app.
  PORT = "8080"
  NODE_ENV = "production"
  GEMINI_TEXT_MODEL = "gemini-2.5-flash"
  # Default avoids paid image-generation API calls; the app returns image prompts.
  IMAGE_MODE = "prompt"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
